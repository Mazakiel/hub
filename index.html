<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mazakiel's game POCs</title>
  <style>
    :root {
      --green: #00ff41;
      --green-dim: #00a32e;
      --green-faint: #004d15;
      --bg: #050805;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--green);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.45);
    }
    /* léger effet scanlines CRT */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.22) 2px 4px);
    }
    #terminal {
      width: min(90vw, 640px);
      font-size: 15px;
      line-height: 1.7;
      padding: 20px 0;
    }
    .line { min-height: 1.7em; }
    .dim { color: var(--green-dim); text-shadow: none; }
    #header { font-size: 20px; letter-spacing: 1px; }
    #divider { color: var(--green-faint); margin: 6px 0 12px; text-shadow: none; }
    #projects { display: flex; flex-direction: column; gap: 2px; }
    .project {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 3px 8px;
      text-decoration: none;
      color: inherit;
      border-left: 2px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
    }
    .project .arrow { width: 1.1em; color: var(--green-dim); }
    .project .name { font-weight: 600; }
    .project .date { margin-left: auto; color: var(--green-dim); text-shadow: none; }
    .project:hover {
      background: rgba(0, 255, 65, 0.08);
      border-left-color: var(--green);
      color: #d0ffd0;
    }
    .project:hover .arrow { color: var(--green); }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 480px) {
      #terminal { font-size: 13px; }
      #header { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="terminal">
    <div class="line" id="header"></div>
    <div class="line dim" id="sub"></div>
    <div class="line" id="divider"></div>
    <div id="projects"></div>
    <div class="line" id="prompt"></div>
  </div>

  <script>
    // Triés par date, plus récents en premier.
    const PROJECTS = [
      { name: 'incremental',      url: './incremental/',      date: '2026-07-23' },
      { name: 'symbiose-2026',    url: './symbiose-2026/',    date: '2026-06-19' },
      { name: 'path-to-eternity', url: './path-to-eternity/', date: '2026-01-07' },
      { name: 'symbiose-outer-lands', url: './symbiose-outer-lands/', date: '2025-07-02' },
    ];

    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Construit les lignes projet (texte révélé ensuite par la machine à écrire).
    const listEl = $('projects');
    PROJECTS.forEach((p) => {
      const a = document.createElement('a');
      a.className = 'project';
      a.href = p.url;
      a.innerHTML =
        '<span class="arrow"></span><span class="name"></span><span class="date"></span>';
      a.dataset.name = p.name;
      a.dataset.date = p.date;
      listEl.appendChild(a);
    });

    async function typeInto(el, text, speed) {
      for (const ch of text) {
        el.textContent += ch;
        await sleep(speed);
      }
    }

    async function run() {
      await typeInto($('header'), "Mazakiel's game POCs", 45);
      await typeInto($('sub'), '$ mazakiel@dev ~ projects sorted by date', 18);
      await typeInto($('divider'), '-'.repeat(46), 8);

      for (const a of listEl.children) {
        await typeInto(a.querySelector('.arrow'), '>', 40);
        await typeInto(a.querySelector('.name'), a.dataset.name, 30);
        await sleep(140);
        await typeInto(a.querySelector('.date'), a.dataset.date, 22);
      }

      await typeInto($('prompt'), '$ ', 40);
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.textContent = '█';
      $('prompt').appendChild(cursor);
    }

    run();
  </script>
</body>
</html>
